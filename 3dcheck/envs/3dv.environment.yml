# Conda layer only: interpreter, CUDA toolkit (nvcc + headers) and compilers.
# Python packages are installed afterwards with uv (see 3dv.requirements.txt, setup_3dv.sh).
name: 3dv
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - uv
  - git
  - ninja
  - cmake
  # nvcc + dev headers for JIT / extension builds (gsplat, BEVFusion ops, curope, tiny-cuda-nn).
  # Must match the CUDA of the torch wheel (torch 2.1.2 on PyPI = cu121).
  # Not the `cuda-toolkit` metapackage: it also pulls Nsight GUI deps (Qt, gstreamer), ~4GB extra.
  - cuda-version=12.1
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-libraries-dev
  - cuda-nvtx-dev
  - cuda-profiler-api
  - cuda-cccl
  # gcc 11: with gcc 12, nvcc 12.1 fails on torch 2.1's bundled pybind11 (cast.h:45) for .cu files that
  # include <torch/extension.h> (e.g. DUSt3R curope). Verified in step 1: gcc 11.4 / 10.4 build, 12.4 fails.
  - gxx=11
  # open3d needs libEGL/libGL; headless images (RunPod, CI) often lack them
  - libegl
  - libgl
